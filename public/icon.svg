<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" fill="none">
  <rect width="256" height="256" rx="32" fill="#9810fa"/> <!-- Background (Blue) -->
  
  <!-- Grid -->
  <g stroke="#fff" stroke-width="6">
    <!-- Outer Box -->
    <rect x="32" y="32" width="192" height="192"/>
    <!-- Vertical Lines -->
    <line x1="96" y1="32" x2="96" y2="224"/>
    <line x1="160" y1="32" x2="160" y2="224"/>
    <!-- Horizontal Lines -->
    <line x1="32" y1="96" x2="224" y2="96"/>
    <line x1="32" y1="160" x2="224" y2="160"/>
  </g>
  
  <!-- Highlighted Cell -->
  <rect x="96" y="96" width="64" height="64" fill="#FFC107" stroke="#fff" stroke-width="4" rx="4"/>

  <!-- Numbers (Stylized) -->
  <text x="64" y="80" font-family="Arial" font-size="28" fill="white" font-weight="bold">5</text>
  <text x="128" y="80" font-family="Arial" font-size="28" fill="white" font-weight="bold">3</text>
  <text x="192" y="80" font-family="Arial" font-size="28" fill="white" font-weight="bold">7</text>
  <text x="64" y="144" font-family="Arial" font-size="28" fill="white" font-weight="bold">6</text>
  <text x="128" y="144" font-family="Arial" font-size="28" fill="black" font-weight="bold">4</text> <!-- Centered, black for contrast -->
  <text x="192" y="144" font-family="Arial" font-size="28" fill="white" font-weight="bold">2</text>
  <text x="64" y="208" font-family="Arial" font-size="28" fill="white" font-weight="bold">8</text>
  <text x="128" y="208" font-family="Arial" font-size="28" fill="white" font-weight="bold">1</text>
  <text x="192" y="208" font-family="Arial" font-size="28" fill="white" font-weight="bold">9</text>
</svg>