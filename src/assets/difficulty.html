<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku | Difficulty</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
      .difficulty-card {
        transition: all 0.3s ease;
        cursor: pointer;
      }
      .difficulty-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }
      .difficulty-card:active {
        transform: translateY(0);
      }
      .emoji {
        font-size: 2rem;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-gray-800 mb-2">Choose Difficulty</h1>
        <p class="text-gray-600">Select your challenge level</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <a href="game.html" class="difficulty-card bg-white rounded-xl shadow-md p-6 text-center">
          <div class="emoji">😊</div>
          <h3 class="font-bold text-lg text-green-600">Easy</h3>
          <p class="text-gray-500 text-sm">Perfect for beginners</p>
        </a>

        <a href="game.html" class="difficulty-card bg-white rounded-xl shadow-md p-6 text-center">
          <div class="emoji">😎</div>
          <h3 class="font-bold text-lg text-blue-600">Medium</h3>
          <p class="text-gray-500 text-sm">Balanced challenge</p>
        </a>

        <a href="game.html" class="difficulty-card bg-white rounded-xl shadow-md p-6 text-center">
          <div class="emoji">🧐</div>
          <h3 class="font-bold text-lg text-yellow-600">Hard</h3>
          <p class="text-gray-500 text-sm">For puzzle lovers</p>
        </a>

        <a href="game.html" class="difficulty-card bg-white rounded-xl shadow-md p-6 text-center">
          <div class="emoji">🤯</div>
          <h3 class="font-bold text-lg text-red-600">Expert</h3>
          <p class="text-gray-500 text-sm">Only for masters</p>
        </a>
      </div>
    </div>

    <script>
      AOS.init();
    </script>
    <script>
      feather.replace();
    </script>
  </body>
</html>
