<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sudoku | Result</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <style>
      .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: #f00;
        border-radius: 50%;
        animation: fall 5s linear infinite;
      }
      @keyframes fall {
        to {
          transform: translateY(100vh);
        }
      }
      .result-card {
        transform-style: preserve-3d;
        transition: all 0.5s ease;
      }
      .result-card:hover {
        transform: rotateY(10deg) rotateX(5deg);
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div id="confetti-container" class="fixed inset-0 overflow-hidden pointer-events-none"></div>

    <div class="w-full max-w-md text-center">
      <div class="result-card bg-white rounded-2xl shadow-xl overflow-hidden transform">
        <div class="bg-gradient-to-r from-purple-500 to-pink-500 p-6 text-white">
          <div class="text-6xl mb-4">🎉</div>
          <h1 class="text-3xl font-bold">Congratulations!</h1>
          <p class="opacity-90">You solved the puzzle!</p>
        </div>

        <div class="p-6">
          <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-gray-100 rounded-lg p-3">
              <p class="text-gray-500 text-sm">Time</p>
              <p class="font-bold text-lg">05:47</p>
            </div>
            <div class="bg-gray-100 rounded-lg p-3">
              <p class="text-gray-500 text-sm">Mistakes</p>
              <p class="font-bold text-lg">0</p>
            </div>
            <div class="bg-gray-100 rounded-lg p-3">
              <p class="text-gray-500 text-sm">Difficulty</p>
              <p class="font-bold text-lg">Medium</p>
            </div>
          </div>

          <div class="flex space-x-3">
            <a
              href="difficulty.html"
              class="flex-1 bg-white border border-gray-300 rounded-lg py-3 font-bold shadow-sm hover:bg-gray-50 transition flex items-center justify-center"
            >
              <i data-feather="play" class="mr-2"></i> Play Again
            </a>
            <a
              href="#"
              class="flex-1 bg-gray-800 text-white rounded-lg py-3 font-bold shadow-lg hover:bg-gray-700 transition flex items-center justify-center"
            >
              <i data-feather="share-2" class="mr-2"></i> Share
            </a>
          </div>

          <div class="mt-6 pt-6 border-t border-gray-200">
            <h3 class="font-bold text-gray-800 mb-3">Your Stats</h3>
            <div class="bg-gray-100 rounded-lg p-4">
              <div class="flex justify-between mb-2">
                <span class="text-gray-600">Games Played</span>
                <span class="font-bold">12</span>
              </div>
              <div class="flex justify-between mb-2">
                <span class="text-gray-600">Win Rate</span>
                <span class="font-bold">83%</span>
              </div>
              <div class="flex justify-between">
                <span class="text-gray-600">Avg. Time</span>
                <span class="font-bold">07:32</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      AOS.init();
      feather.replace();

      // Simple confetti effect
      function createConfetti() {
        const colors = ["#f00", "#0f0", "#00f", "#ff0", "#f0f", "#0ff"];
        const container = document.getElementById("confetti-container");

        for (let i = 0; i < 50; i++) {
          const confetti = document.createElement("div");
          confetti.className = "confetti";
          confetti.style.left = Math.random() * 100 + "vw";
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDuration = Math.random() * 3 + 2 + "s";
          confetti.style.animationDelay = Math.random() * 5 + "s";
          confetti.style.opacity = Math.random();
          confetti.style.width = Math.random() * 8 + 4 + "px";
          confetti.style.height = Math.random() * 8 + 4 + "px";
          container.appendChild(confetti);
        }
      }

      createConfetti();
    </script>
  </body>
</html>
